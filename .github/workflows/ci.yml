name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  apple:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-15-intel
            arch: x86_64
            minimum: "10.13"
          - name: macOS Apple Silicon
            runner: macos-15
            arch: arm64
            minimum: "11.0"
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
      - name: Prepare Apple build tools
        run: |
          xcodebuild -version
          for formula in autoconf automake libtool make; do
            brew list --versions "$formula" >/dev/null || brew install "$formula"
          done
      - name: Build and run the native regression tests
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.minimum }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          ./build.sh

  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/29.0.14206865
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true

      - name: Install build and test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            autoconf \
            automake \
            ca-certificates \
            curl \
            file \
            gcc-mingw-w64-x86-64 \
            libffi-dev \
            libltdl-dev \
            libtool \
            pkg-config \
            unzip \
            valgrind \
            wine \
            xz-utils \
            zip

      - name: Build libffi for Windows and Android
        run: make libffi-win32 libffi-android

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: c-cpp
          build-mode: manual
          queries: ./.github/codeql/tra-ffic.qls

      - name: Build native test binaries
        env:
          # Make CodeQL use each compiler's include paths without falling back to /usr/include.
          USR_INCLUDE: ""
        run: make -j2 build-native-tests

      - name: Analyze with CodeQL
        id: analyze
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:c-cpp

      - name: Verify CodeQL extracted the library and native tests
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          jq -e '
            [.runs[].invocations[].toolExecutionNotifications[]
              | select(.descriptor.id == "cpp/diagnostics/successfully-extracted-files")
              | .locations[].physicalLocation.artifactLocation.uri] as $extracted
            | ["include/tra_ffic.h", "tests/tra_ffic_test.c", "tests/android/tra_ffic_android_test.c"]
              - $extracted
            | if length == 0 then true else error("Missing from CodeQL: \(join(", "))") end
          ' "$SARIF_DIR/cpp.sarif"

      - name: Run tests
        env:
          # Keep CodeQL's preloaded tracer out of Valgrind and AddressSanitizer.
          LD_PRELOAD: ""
        run: ./build.sh

  android-runtime:
    name: Android runtime (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API 24 / 4 KiB
            api: 24
            image_tag: google_apis
            page_size: 4096
          - name: API 35 / 16 KiB
            api: 35
            image_tag: google_apis_ps16k
            page_size: 16384
    env:
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/29.0.14206865
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true

      - name: Install native build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            libltdl-dev \
            libtool \
            unzip \
            zip

      - name: Cache Android emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/emulator
          key: android-emulator-${{ runner.os }}-v1

      - name: Cache Android system image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ matrix.api }}/${{ matrix.image_tag }}/x86_64
          key: android-system-image-${{ runner.os }}-${{ matrix.api }}-${{ matrix.image_tag }}-x86_64-v1

      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Run Android tests
        run: >-
          tests/android/run_emulator_tests.sh
          ${{ matrix.api }}
          ${{ matrix.image_tag }}
          ${{ matrix.page_size }}

  android-runtime-api35-4k:
    name: Android runtime (API 35 / 4 KiB, extended)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/29.0.14206865
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true

      - name: Install native build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            libltdl-dev \
            libtool \
            unzip \
            zip

      - name: Cache Android emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/emulator
          key: android-emulator-${{ runner.os }}-v1

      - name: Cache Android system image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: android-system-image-${{ runner.os }}-35-google_apis-x86_64-v1

      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Run Android tests
        run: tests/android/run_emulator_tests.sh 35 google_apis 4096
