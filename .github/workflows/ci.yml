name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/29.0.14206865
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true

      - name: Install build and test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            autoconf \
            automake \
            ca-certificates \
            gcc-mingw-w64-x86-64 \
            libffi-dev \
            libltdl-dev \
            libtool \
            pkg-config \
            unzip \
            valgrind \
            wine \
            zip

      - name: Build and test
        run: ./build.sh

  android-runtime:
    name: Android runtime (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API 24 / 4 KiB
            api: 24
            image_tag: google_apis
            page_size: 4096
          - name: API 35 / 16 KiB
            api: 35
            image_tag: google_apis_ps16k
            page_size: 16384
    env:
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/29.0.14206865
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true

      - name: Install native build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            libltdl-dev \
            libtool \
            unzip \
            zip

      - name: Cache Android emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/emulator
          key: android-emulator-${{ runner.os }}-v1

      - name: Cache Android system image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ matrix.api }}/${{ matrix.image_tag }}/x86_64
          key: android-system-image-${{ runner.os }}-${{ matrix.api }}-${{ matrix.image_tag }}-x86_64-v1

      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Run Android tests
        run: >-
          tests/android/run_emulator_tests.sh
          ${{ matrix.api }}
          ${{ matrix.image_tag }}
          ${{ matrix.page_size }}

  android-runtime-api35-4k:
    name: Android runtime (API 35 / 4 KiB, extended)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/29.0.14206865
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true

      - name: Install native build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            libltdl-dev \
            libtool \
            unzip \
            zip

      - name: Cache Android emulator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/emulator
          key: android-emulator-${{ runner.os }}-v1

      - name: Cache Android system image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: android-system-image-${{ runner.os }}-35-google_apis-x86_64-v1

      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Run Android tests
        run: tests/android/run_emulator_tests.sh 35 google_apis 4096

  codeql:
    name: CodeQL (C/C++)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: c-cpp
          build-mode: none

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: /language:c-cpp
